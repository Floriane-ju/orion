# Les `overrides` de pnpm 11 vivent ici, plus dans package.json.
#
# Tous tirés par `vite-plugin-pwa > workbox-build`, qui les borne à des plages vulnérables.
# Rien en amont ne remonte : l'override est le seul moyen de faire passer `pnpm audit`, que la
# CI traite comme un arrêt (T-0077).
# - `fast-uri` (via `ajv`) : GHSA host confusion, SSRF, normalisation de casse de l'hôte.
# - `brace-expansion` (via `minimatch`, deux majeures) : GHSA déni de service par expansion
#   quadratique. Chaque majeure garde sa plage pour ne pas casser l'API attendue.
overrides:
  fast-uri: ^3.1.8
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
